<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculator</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="unit">
  <div class="brandrow">
    <span class="mark">ARITH · 01</span>
    <span class="model">no. 4471</span>
  </div>

  <div class="screen">
    <div class="history" id="history">&nbsp;</div>
    <div class="result" id="result">0</div>
  </div>

  <div class="pad" id="pad">
    <button class="key-util" data-action="clear">C</button>
    <button class="key-util" data-action="backspace">⌫</button>
    <button class="key-util" data-action="percent">%</button>
    <button class="key-op" data-op="÷">÷</button>

    <button class="key-num" data-num="7">7</button>
    <button class="key-num" data-num="8">8</button>
    <button class="key-num" data-num="9">9</button>
    <button class="key-op" data-op="×">×</button>

    <button class="key-num" data-num="4">4</button>
    <button class="key-num" data-num="5">5</button>
    <button class="key-num" data-num="6">6</button>
    <button class="key-op" data-op="−">−</button>

    <button class="key-num" data-num="1">1</button>
    <button class="key-num" data-num="2">2</button>
    <button class="key-num" data-num="3">3</button>
    <button class="key-op" data-op="+">+</button>

    <button class="key-num key-zero" data-num="0">0</button>
    <button class="key-num" data-num=".">.</button>
    <button class="key-eq" data-action="equals">=</button>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
